# render.yaml – Render.com deployment configuration
#
# Required per service:
#   DERIV_API_TOKEN  – Deriv API token (trade + read scope)
# Optional (all have defaults, see CHANGES.md):
#   DERIV_ACCOUNT_MODE (demo|real), DASHBOARD_PIN, PREDICTOR_SYMBOLS (default R_100),
#   PREDICTOR_STAKE (1000), MIN_PAYOUT_RATIO (1.8) ...
#   REDEPLOY_INTERVAL_SECONDS (0 = scheduled self-redeploy OFF, the default; the bot runs
#     continuously and heals itself: reconnect-forever, stale-tick watchdog, periodic refit).
#     If you set it > 0 you also need RENDER_API_KEY so the bot can trigger the redeploy.
#   STALE_TICK_SECONDS (30), REFIT_INTERVAL_SECONDS (300), STATS_PERSIST_TO_RENDER (0)

#   TARGET_BALANCE (unset/0 = OFF) - account balance you want. The moment Deriv's LIVE balance
#     is >= this, the bot stops trading (open trades or not), closes the Deriv connection and
#     SUSPENDS this Render service. Needs RENDER_API_KEY (below) for the suspend step.
#     TARGET_CHECK_SECONDS (3) = how often the balance is also polled directly.

# ── Follower accounts (optional; the collector runs the same without them) ─────────────
#   Set on Render (Environment tab; never put values in this file):
#     DATABASE_URL    - Neon pooled connection string (already set)
#     ADMIN_PASSWORD  - password for /followers /verdict /capacity (pages refuse to load without it)
#     ENCRYPTION_KEY  - Fernet key that encrypts follower tokens. Generate once with:
#         python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#   Optional (defaults in brackets):
#     DEFAULT_ZONE_START (53), DEFAULT_ZONE_END (59)  - pre-registered HYPOTHESIS window, minutes of the
#       hour, inclusive: starts 53:00.0, last opening 59:59.9. A test, not a claimed edge.
#     ZONE_MIN_TRADES (150), ZONE_MAX_PER_HOUR (3), VERDICT_MIN_TRADES (300),
#     FOLLOWER_LOCK_THRESHOLD (5.0)
#   Keep TARGET_BALANCE UNSET, otherwise the collector would stop.
#   Demo/real is ONE global switch on the /followers page (typed confirmation), not an env var.

services:
  - type: web
    name: sifm-deriv-bot
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: python main.py

    envVars:
      - key: DERIV_API_TOKEN
        sync: false
      - key: REDEPLOY_INTERVAL_SECONDS
        value: "0"
      - key: RENDER_API_KEY
        sync: false
      - key: TARGET_BALANCE
        sync: false
