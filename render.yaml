# render.yaml – Render.com deployment configuration
#
# Required per service:
#   DERIV_API_TOKEN  – Deriv API token (trade + read scope)
# Optional (all have defaults, see CHANGES.md):
#   DERIV_ACCOUNT_MODE (demo|real), DASHBOARD_PIN, PREDICTOR_SYMBOLS (default R_100),
#   PREDICTOR_STAKE (1000), MIN_PAYOUT_RATIO (1.8) ...
#   SESSION_WINDOW_ENABLED (1 = on, default; 0 = off: trade all hours, stay connected, no hourly redeploy).
#   TRADE WINDOW: connected to Deriv only minutes 29-36 of each hour (UTC). When the window closes the bot
#     disconnects and redeploys itself with the build cache CLEARED (needs RENDER_API_KEY, required now),
#     then idles until ~40 s before minute 29 (WINDOW_PRECONNECT_SECONDS, default 40). REDEPLOY_INTERVAL_SECONDS is ignored.
#   SELF-REDEPLOY is ALWAYS ON: every AUTO_REDEPLOY_SECONDS (bottom of config.py; 420 = 7 min), forever, and it
#     turns the hourly trade window off. REDEPLOY_INTERVAL_SECONDS=0 (env) is the only off switch.
#     Needs RENDER_API_KEY so the bot can trigger the redeploy.
#   STALE_TICK_SECONDS (30), REFIT_INTERVAL_SECONDS (300), STATS_PERSIST_TO_RENDER (0)

#   TARGET_BALANCE (unset/0 = OFF) - account balance you want. The moment Deriv's LIVE balance
#     is >= this, the bot stops trading (open trades or not), closes the Deriv connection and
#     SUSPENDS this Render service. Needs RENDER_API_KEY (below) for the suspend step.
#     TARGET_CHECK_SECONDS (3) = how often the balance is also polled directly.

# ── Follower accounts (optional; the main account runs the same without them) ─────────────
#   Set on Render (Environment tab; never put values in this file):
#     DATABASE_URL    - Neon pooled connection string (already set)
#     ADMIN_PASSWORD  - password for /followers /verdict /capacity (pages refuse to load without it)
#     ENCRYPTION_KEY  - Fernet key that encrypts follower tokens. Generate once with:
#         python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#   Optional (defaults in brackets):
#     DEFAULT_ZONE_START (53), DEFAULT_ZONE_END (59)  - pre-registered HYPOTHESIS window, minutes of the
#       hour, inclusive: starts 53:00.0, last opening 59:59.9. A test, not a claimed edge.
#     ZONE_MIN_TRADES (150), ZONE_MAX_PER_HOUR (3), VERDICT_MIN_TRADES (300),
#     FOLLOWER_LOCK_THRESHOLD (5.0)
#   (the main account trades on its own; TARGET_BALANCE, if set, still stops it.)
#   Demo/real is ONE global switch on the /followers page (typed confirmation), not an env var.

# ── MH recommended env values (Phase 2; code defaults are unchanged, set these on Render to use them) ──
#   MH_DEADLINE_RTT=p95   # deadline gate uses the 95th-percentile RTT: conservative against tail latency (EWMA until 20 samples)
#   MH_HMAX_TRADE=2       # trade only horizons 1-2, the ones the log-loss gate proves best
#   MH_BUY_TIMEOUT_SECONDS=3   # buy reply timeout; a timed-out buy is reconciled (late reply / portfolio / profit_table)
#   MH_RANK_WINDOW_SECONDS=60  # use 60 to compare Phases 1-4 on the old per-minute basis (code default is 30)

services:
  - type: web
    name: sifm-deriv-bot
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: python main.py

    envVars:
      - key: DERIV_API_TOKEN
        sync: false
      - key: AUTO_REDEPLOY      # ignored: the 7-minute redeploy cycle (config.AUTO_REDEPLOY_SECONDS = 420) is always on; REDEPLOY_INTERVAL_SECONDS=0 stops it
        value: "1"
      - key: RENDER_API_KEY
        sync: false
      - key: PREDICTOR_STAKE      # MINIMUM stake for the main account AND the followers (money rules size up from it)
        sync: false
      - key: TARGET_BALANCE
        sync: false
