# render.yaml – Render.com deployment configuration
#
# Required per service:
#   DERIV_API_TOKEN  – Deriv API token (trade + read scope)
#   RENDER_API_KEY   – Render Dashboard → Account Settings → API Keys. Lets the bot
#                      redeploy itself every 150 s AND persist minute-of-hour stats
#                      across redeploys (Render's disk is ephemeral).
# Optional (all have defaults, see CHANGES.md):
#   DERIV_ACCOUNT_MODE (demo|real), DASHBOARD_PIN, PREDICTOR_SYMBOLS (default R_100),
#   PREDICTOR_STAKE (1000), REDEPLOY_INTERVAL_SECONDS (150), MIN_PAYOUT_RATIO (1.8) ...

services:
  - type: web
    name: sifm-deriv-bot
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: python main.py

    envVars:
      - key: DERIV_API_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
