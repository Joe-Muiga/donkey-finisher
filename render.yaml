# render.yaml – Render.com deployment configuration
#
# Required per service:
#   DERIV_API_TOKEN  – Deriv API token (trade + read scope)
#   RENDER_API_KEY   – Render API key. STILL REQUIRED: the single pre-Session-A redeploy (below) and the TARGET_BALANCE
#                      suspend both call the Render API with it. Without it the redeploy is skipped (logged) and the
#                      bot keeps running on the instance it has.
# Optional (all have defaults, see CHANGES.md):
#   DERIV_ACCOUNT_MODE (demo|real), DASHBOARD_PIN, PREDICTOR_SYMBOLS (default R_100),
#   PREDICTOR_STAKE (1000), MIN_PAYOUT_RATIO (1.8) ...
#   STALE_TICK_SECONDS (30), REFIT_INTERVAL_SECONDS (300), STATS_PERSIST_TO_RENDER (0)

# ── TRADING SESSIONS: two per hour, every hour, every day (UTC, judged on DERIV'S SERVER clock) ──────────────
#   One long-lived process. It trades in two sessions each hour and is connected to Deriv ONLY around them:
#
#     Session | buying open (inclusive) | buying closed (exclusive) | connected from (lead) | disconnected after (drain)
#     A       | HH:05:00.000            | HH:12:01.000              | HH:03:00              | about HH:12:11
#     B       | HH:24:00.000            | HH:29:01.000              | HH:22:00              | about HH:29:11
#
#   The session times are plain constants in config.py (SESSION_A_*/SESSION_B_*/SESSION_CLOSE_EXTRA_SECONDS), NOT env vars,
#   so a stale value here can never widen a session. Between sessions (including the ~9 min 50 s between A and B) the bot has
#   no websocket, no authorise/OTP, no polling and no background Deriv requests. Session B is reached by an in-process
#   disconnect/reconnect, never a redeploy. Models refit in-process inside every lead except the first one after a fresh
#   process start (that one runs the normal boot fit). A process that BOOTS inside a session waits for the next open
#   (RESUME_TRADING_MID_SESSION_AFTER_BOOT=0 default).
#   The old rolling auto-redeploy, the 29-36 minute window and every REDEPLOY_* / AUTO_REDEPLOY* / SESSION_WINDOW_ENABLED
#   env var are GONE: if any is still set on this service it is ignored and one WARNING at boot lists it. Delete them.
#
#   Tunables (env vars, defaults in brackets; all live in config.py):
#     WINDOW_PRECONNECT_SECONDS (120)  – the connect lead: how long before a session opens the bot connects. It must cover
#         the boot/refit budget (MH_BOOT_BUDGET_SECONDS, 75), connect, history and the clock burst. Measure, then tune.
#     SESSION_DRAIN_SECONDS (10)       – the only connected time after a close (settle stragglers, then disconnect).
#     SESSION_BUY_CUTOFF_SECONDS (0)   – stop buying this long before the close.
#     SESSION_CLOCK_SYNC_SAMPLES (10), SESSION_CLOCK_MIN_INTERVAL (0.25), SESSION_CLOCK_FLIP_SECONDS (4),
#     SESSION_CLOCK_RESYNC_SECONDS (300) – Deriv server-clock sync (burst in every lead, light resync while connected).
#     SESSION_SCHEDULE_ENABLED (1)     – dev override only. 0 disables the schedule (always connected, always buying) and is
#         logged CRITICAL at boot. Leave it unset on Render.
#
# ── THE PRE-SESSION REDEPLOYS (before A AND before B, build cache cleared) ───────────────────────────────────
#   One redeploy before EACH session, i.e. two per hour. The running instance fires each one while it is idle in the gap
#   after the previous session, timed so the new instance is up just BEFORE the next connect lead:
#       before A: gap about HH:29:11 to HH:03:00 (~34 min)    before B: gap about HH:12:11 to HH:22:00 (~10 min)
#       fire time = (next connect lead) - (expected deploy duration + safety margin)
#   With the defaults that is about HH:55:00 for A and HH:14:00 for B (240 s + 240 s = 8 min before the connect lead); the
#   expected duration becomes the rolling P95 of recent Render deploy durations once at least 3 are known. NEVER inside a
#   session, a lead or a drain. If it does not fit in the gap (the A-to-B gap is the tight one: ~9.5 min usable), preflight
#   refuses (a failed / still-building deploy, /health not ok, backoff active), the kill switch is on or the target balance is
#   reached, that session is skipped with a WARNING and shown on the dashboard; nothing is retried after the connect lead.
#   The request is {"clearCache": "clear"}: this needs RENDER_API_KEY + RENDER_SERVICE_ID (a deploy hook cannot clear the
#   cache, so with no API key NO redeploy happens and a CRITICAL line is logged at boot).
#   While a fired deploy is replacing the old instance, the old instance holds its connect lead.
#     PRE_SESSION_REDEPLOY_CLEAR_CACHE (1)            – 1 = clearCache "clear" (needs the API key); 0 = "do_not_clear"
#     PRE_A_REDEPLOY_ENABLED (1)                      – 0 = never redeploy (the bot just keeps running); applies to A and B
#     PRE_A_REDEPLOY_DEFAULT_DURATION_SECONDS (240)   – expected deploy time until Render deploy history exists
#     PRE_A_REDEPLOY_SAFETY_MARGIN_SECONDS (240)      – extra time added before the connect lead
#     PRE_A_REDEPLOY_AFTER_DRAIN_BUFFER_SECONDS (15)  – earliest fire = previous session's drain end + this
#     PRE_A_REDEPLOY_HEALTH_TIMEOUT_SECONDS (180)     – a deploy still not live this long after expected = stalled
#     PRE_A_REDEPLOY_BACKOFF_BASE_SECONDS (60), PRE_A_REDEPLOY_BACKOFF_MAX_SECONDS (1800) – backoff after a failed deploy
#   Deploy durations are read from Render (GET /v1/services/{id}/deploys), not stored in an env var.

#   TARGET_BALANCE (unset/0 = OFF) - account balance you want. The moment Deriv's LIVE balance
#     is >= this, the bot stops trading (open trades or not), closes the Deriv connection and
#     SUSPENDS this Render service. Needs RENDER_API_KEY (below) for the suspend step.
#     TARGET_CHECK_SECONDS (3) = how often the balance is also polled directly.

# ── Follower accounts (optional; the main account runs the same without them) ─────────────
#   Set on Render (Environment tab; never put values in this file):
#     DATABASE_URL    - Neon pooled connection string (already set)
#     ADMIN_PASSWORD  - password for /followers /verdict /capacity (pages refuse to load without it)
#     ENCRYPTION_KEY  - Fernet key that encrypts follower tokens. Generate once with:
#         python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#   Optional (defaults in brackets):
#     DEFAULT_ZONE_START (53), DEFAULT_ZONE_END (59)  - pre-registered HYPOTHESIS window, minutes of the
#       hour, inclusive: starts 53:00.0, last opening 59:59.9. A test, not a claimed edge.
#     ZONE_MIN_TRADES (150), ZONE_MAX_PER_HOUR (3), VERDICT_MIN_TRADES (300),
#     FOLLOWER_LOCK_THRESHOLD (5.0)
#   (the main account trades on its own; TARGET_BALANCE, if set, still stops it.)
#   Demo/real is ONE global switch on the /followers page (typed confirmation), not an env var.

# ── MH recommended env values (Phase 2; code defaults are unchanged, set these on Render to use them) ──
#   MH_DEADLINE_RTT=p95   # deadline gate uses the 95th-percentile RTT: conservative against tail latency (EWMA until 20 samples)
#   MH_HMAX_TRADE=2       # trade only horizons 1-2, the ones the log-loss gate proves best
#   MH_BUY_TIMEOUT_SECONDS=3   # buy reply timeout; a timed-out buy is reconciled (late reply / portfolio / profit_table)
#   MH_RANK_WINDOW_SECONDS=60  # use 60 to compare Phases 1-4 on the old per-minute basis (code default is 30 = max 2 trades/minute; allowed 30, 60)

services:
  - type: web
    name: sifm-deriv-bot
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: python main.py

    envVars:
      - key: DERIV_API_TOKEN
        sync: false
      - key: RENDER_API_KEY       # still required: the single pre-Session-A redeploy and the TARGET_BALANCE suspend use it
        sync: false
      - key: PREDICTOR_STAKE      # MINIMUM stake for the main account AND the followers (money rules size up from it)
        sync: false
      - key: TARGET_BALANCE
        sync: false
